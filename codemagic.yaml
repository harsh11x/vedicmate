workflows:
  ios-release-build:
    name: iOS Release IPA
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Remove Shorebird from PATH
        script: |
          # Remove Shorebird's wrapper from PATH so flutter uses the real Flutter
          export PATH=$(echo "$PATH" | tr ':' $'\n' | grep -v shorebird | tr $'\n' ':')
          echo "shoredird removed - using real flutter at $(which flutter)"

      - name: Build release IPA with flutter (without Shorebird)
        script: |
          set -e
          # Remove Shorebird from PATH
          export PATH=$(echo "$PATH" | tr ':' $'\n' | grep -v shorebird | tr $'\n' ':')

          # Get version from pubspec.yaml
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-1}
          echo "Building v$VERSION (build $BUILD_NUMBER)"

          flutter build ipa --release \
            --export-options-plist=ios/export-options.plist \
            --build-name=$VERSION \
            --build-number=$BUILD_NUMBER
