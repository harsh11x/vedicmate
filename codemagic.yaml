workflows:
  ios-release-build:
    name: iOS Release IPA
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles --workspace ios/Runner.xcworkspace --scheme Runner

      - name: Build release IPA with xcodebuild (bypasses Shorebird)
        script: |
          set -e
          cd ios

          # Build version from pubspec.yaml
          VERSION=$(grep '^version: ' ../pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-1}
          echo "Building v$VERSION (build $BUILD_NUMBER)"

          # Archive
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath /tmp/Runner.xcarchive \
            -allowProvisioningUpdates

          # Export IPA
          xcodebuild -exportArchive \
            -archivePath /tmp/Runner.xcarchive \
            -exportPath /tmp/ipa \
            -exportOptionsPlist export-options.plist \
            -allowProvisioningUpdates

          # Copy IPA to artifacts directory
          mkdir -p ../build/ios/ipa
          cp /tmp/ipa/*.ipa ../build/ios/ipa/ 2>/dev/null || true
          echo "✅ IPA built successfully"
          ls -la ../build/ios/ipa/
