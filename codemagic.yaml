workflows:
  ios-release-build:
    name: iOS Release IPA
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build release IPA
        script: |
          set -e

          # Remove Shorebird's wrapper from PATH
          export PATH=$(echo "$PATH" | tr ':' $'\n' | grep -v shorebird | tr $'\n' ':')

          # Fallback: find Flutter at standard Codemagic locations
          if ! command -v flutter &>/dev/null; then
            export PATH="/Users/builder/flutter/bin:/usr/local/bin:$PATH"
            echo "Flutter not on PATH after removing Shorebird. Trying standard paths."
          fi

          echo "Using Flutter at: $(which flutter)"

          # Get version from pubspec.yaml
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=${PROJECT_BUILD_NUMBER:-1}
          echo "Building v$VERSION (build $BUILD_NUMBER)"

          flutter build ipa --release \
            --export-options-plist=ios/export-options.plist \
            --build-name=$VERSION \
            --build-number=$BUILD_NUMBER
