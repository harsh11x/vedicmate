name: vedicmate
description: VedicMate — Spiritual technology connecting Clients and Pandits.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase - Compatible versions
  firebase_core: ^2.32.0
  firebase_auth: ^4.0.0
  cloud_firestore: ^4.0.0
  firebase_storage: ^11.0.0
  firebase_messaging: ^14.0.0
  google_sign_in: ^6.1.5

  # State & routing
  flutter_riverpod: ^2.0.0
  go_router: ^12.0.0

  # UI & Fonts
  google_fonts: ^6.1.0

  # Additional dependencies
  table_calendar: ^3.0.9
  intl: ^0.18.1
  image_picker: ^1.0.4
  share_plus: ^7.2.1
  dio: ^5.3.2
  path_provider: ^2.1.1

  # Payment & HTTP
  http: ^1.5.0
  razorpay_flutter: ^1.3.7
  shared_preferences: ^2.2.2
  
  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.0.1
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
