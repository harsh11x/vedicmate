name: vedic_mate
description: A modern AI-powered astrology consultation app connecting seekers with verified Vedic experts
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Navigation
  go_router: ^12.1.3
  
  # Authentication
  firebase_auth: ^4.15.1
  firebase_core: ^2.24.2
  google_sign_in: ^6.1.6
  phone_number: ^2.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking
  http: ^1.1.2
  dio: ^5.4.0
  
  # Video/Audio Calls
  agora_rtc_engine: ^6.3.0
  permission_handler: ^11.1.0
  
  # Chat
  socket_io_client: ^2.0.3+1
  image_picker: ^1.0.5
  file_picker: ^8.0.0
  
  # Payments
  razorpay_flutter: ^1.3.0
  
  # Notifications
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.0.0
  
  # Calendar & Date
  table_calendar: ^3.0.9
  intl: ^0.18.1
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Utilities
  uuid: ^4.2.1
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  image_cropper: ^8.0.0
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.1
  
  # Analytics & Monitoring
  firebase_analytics: ^10.7.4
  # sentry_flutter: ^7.12.0  # Temporarily disabled due to build issues

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

