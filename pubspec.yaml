name: vedicmate
description: VedicMate — Spiritual technology connecting Clients and Pandits.
publish_to: 'none'
version: 1.0.0+2
environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase - Compatible versions
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.1.5

  # State & routing
  flutter_riverpod: ^2.0.0
  go_router: ^12.0.0

  # UI & Fonts
  google_fonts: ^6.1.0

  # Additional dependencies
  table_calendar: ^3.0.9
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.0.4
  share_plus: ^7.2.1
  url_launcher: ^6.2.5
  video_player: ^2.8.2
  dio: ^5.3.2
  path_provider: ^2.1.1

  # Payment & HTTP
  http: ^1.5.0
  razorpay_flutter: ^1.3.7
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  
  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  permission_handler: ^11.0.1
  flutter_local_notifications: ^17.0.0
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0
  supabase_flutter: ^2.12.0
  postgres: ^3.5.9
  country_state_city_pro: ^0.0.6
  flutter_webrtc: ^1.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/remedies/
    - assets/images/ai_pandits/
    - assets/images/services/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
