name: vedicmate
description: VedicMate — Spiritual technology connecting Clients and Pandits.
publish_to: 'none'
version: 1.0.0+16
environment:
  sdk: '>=2.18.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase - Compatible versions
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.3

  # State & routing
  flutter_riverpod: ^2.0.0
  go_router: ^12.0.0

  # UI & Fonts
  google_fonts: ^6.1.0

  # Additional dependencies
  table_calendar: ^3.0.9
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.0
  share_plus: ^7.2.1
  url_launcher: ^6.2.5
  video_player: ^2.9.0
  dio: ^5.9.0
  path_provider: ^2.1.1

  # Payment & HTTP
  http: ^1.6.0
  shared_preferences: ^2.5.0
  socket_io_client: ^2.0.3+1
  
  # Payment
  razorpay_flutter: ^1.4.0
  
  # Voice & Speech
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  permission_handler: ^11.4.0
  flutter_local_notifications: ^17.2.0
  
  # PDF Generation
  pdf: ^3.11.0
  printing: ^5.14.0
  add_to_google_wallet: ^0.0.5
  apple_passkit: ^1.3.1
  supabase_flutter: ^2.12.0
  postgres: ^3.5.9
  country_state_city_pro: ^0.0.6
  flutter_webrtc: ^1.4.1

  flutter_animate: ^4.5.2
  
  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Astronomy
  sweph: ^3.2.1+2.10.3
  just_audio: ^0.10.5
  audio_session: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/remedies/
    - assets/images/ai_pandits/
    - assets/images/services/
    - assets/images/home_cards/
    - assets/images/yoga/
    - assets/images/timeline/
    - assets/icons/
    - assets/animations/
    - assets/data/history/
    - assets/data/scriptures/
    - assets/data/yoga/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_1024.jpg"
  min_sdk_android: 21
  remove_alpha_ios: false
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_1024.jpg"
