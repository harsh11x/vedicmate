# iOS App Store Deployment
#
# Builds the iOS app using the latest stable Xcode on GitHub's macOS runners
# and uploads it to App Store Connect for TestFlight or App Store review.
#
# Why this exists:
# - Your local macOS is on macOS 27 beta, which only supports Xcode 27 beta
# - Apple requires submissions to be built with the latest GM (stable) Xcode
# - GitHub Actions runners have stable Xcode pre-installed
#
# ── Prerequisites ──────────────────────────────────────────────────
#
# 1. Create an App Store Connect API key at:
#    https://appstoreconnect.apple.com/access/api
#    → Click "+" → "Generate API Key"
#    → Select "App Manager" or "Admin" access
#    → Download the .p8 file, note the Key ID & Issuer ID
#
# 2. Export your Distribution Certificate (.p12) from Keychain Access:
#    → Open Keychain Access → "My Certificates"
#    → Right-click the "Apple Distribution: ..." certificate
#    → Export "..." → save as .p12 with a password
#    → Base64-encode: cat Certificates.p12 | base64
#
# 3. Export your App Store provisioning profile:
#    → Download from https://developer.apple.com/account/resources/profiles
#    → Base64-encode: cat profile.mobileprovision | base64
#
# 4. Add these secrets to your GitHub repo:
#    Settings → Secrets and variables → Actions → New repository secret
#
#    ┌─────────────────────────────────────┬─────────────────────────────────┐
#    │ Secret name                         │ Value                          │
#    ├─────────────────────────────────────┼─────────────────────────────────┤
#    │ APP_STORE_CONNECT_API_KEY_ID        │ Key ID from App Store Connect  │
#    │ APP_STORE_CONNECT_API_ISSUER_ID     │ Issuer ID (UUID format)        │
#    │ APP_STORE_CONNECT_API_KEY           │ Full .p8 file content          │
#    │ BUILD_CERTIFICATE_BASE64            │ Base64 of your .p12 cert       │
#    │ BUILD_CERTIFICATE_PASSWORD          │ .p12 export password           │
#    │ BUILD_PROVISIONING_PROFILE_BASE64   │ Base64 of .mobileprovision     │
#    └─────────────────────────────────────┴─────────────────────────────────┘

name: iOS App Store Deploy

on:
  # Manual trigger — go to Actions tab → select this workflow → "Run workflow"
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to auto-increment)'
        required: false
        type: string

  # Automatic trigger — runs when you push a tag like v1.0.0, v1.2.3, etc.
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  build-and-deploy:
    name: Build & Upload to App Store
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── Tooling Setup ──────────────────────────────────────────

      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🔧 Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'  # Picks the latest GM, not beta

      - name: ✅ Verify Xcode & Flutter versions
        run: |
          xcodebuild -version
          flutter --version

      # ── Code Signing Setup ─────────────────────────────────────

      - name: 🔐 Install distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ]; then
            echo "⚠️  BUILD_CERTIFICATE_BASE64 not set — skipping"
            exit 0
          fi

          # Create a temp keychain for this build
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          # Create and unlock keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import the .p12 certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign 2>/dev/null || security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD"

          # Add keychain to search path
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security default-keychain 2>/dev/null || echo "")
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

          echo "✅ Certificate installed"

      - name: 📜 Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$PROFILE_BASE64" ]; then
            echo "⚠️  BUILD_PROVISIONING_PROFILE_BASE64 not set — skipping"
            exit 0
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "✅ Provisioning profile installed"

      # ── Dependencies ───────────────────────────────────────────

      - name: 📦 Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 📚 Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      # ── Build ──────────────────────────────────────────────────

      - name: 🏗️ Build iOS IPA (Release)
        run: |
          BUILD_FLAGS="--release --export-options-plist=ios/export-options.plist"
          if [[ -n "${{ inputs.build_number }}" ]]; then
            BUILD_FLAGS="$BUILD_FLAGS --build-number=${{ inputs.build_number }}"
          fi
          flutter build ipa $BUILD_FLAGS

      # ── Upload ─────────────────────────────────────────────────

      - name: 🔑 Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY" > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "✅ App Store Connect API key installed"

      - name: 📤 Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

      - name: 💾 Upload IPA as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: ✅ Notify success
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ✅ Build & upload completed successfully!      ║"
          echo "║                                                ║"
          echo "║  📱 Check App Store Connect → TestFlight       ║"
          echo "║     for the new build. It takes ~30 mins       ║"
          echo "║     to process.                                ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
